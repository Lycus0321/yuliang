name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/yuliang-android.apk
          sha256sum artifacts/yuliang-android.apk > artifacts/yuliang-android.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuliang-android-apk
          path: artifacts/*
          if-no-files-found: error

      - name: Publish APK release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 余量 Android 测试版
          body: |
            由 GitHub Actions 自动构建的 Android 测试 APK。

            Android 端直接连接拓竹 API，不依赖 Cloudflare Worker。
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: artifacts/*
